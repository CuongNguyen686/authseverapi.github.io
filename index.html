<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="description" content="Nguyễn Cường iOS • ChatGPTDeveloper — KeyAuth management dashboard">
<title>Nguyễn Cường iOS • ChatGPTDeveloper</title>
<style>
:root{--bg:#07080c;--panel:#0e1016;--panel2:#12151d;--line:#242733;--text:#f5f7fb;--muted:#9298a8;--accent:#ff3d91;--accent2:#ff77b2;--good:#38d996;--warn:#ffc857;--bad:#ff5d73;--shadow:0 20px 60px rgba(0,0,0,.32)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--bg);color:var(--text)}body{overflow-x:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.ambient{position:fixed;pointer-events:none;filter:blur(90px);opacity:.18;border-radius:50%}.a1{width:360px;height:360px;background:var(--accent);top:-150px;right:-100px}.a2{width:280px;height:280px;background:#7b61ff;bottom:-120px;left:-100px}.sidebar{position:fixed;z-index:20;left:0;top:0;bottom:0;width:255px;padding:22px 15px;background:rgba(9,10,14,.9);border-right:1px solid var(--line);backdrop-filter:blur(20px);display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;padding:4px 9px 20px;font-size:14px}.brand b{color:var(--accent)}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#9d4edd);box-shadow:0 8px 25px rgba(255,61,145,.25)}.workspace{font-size:11px;color:var(--muted);padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;display:flex;align-items:center;gap:7px}.workspace svg{color:var(--good)}nav{display:grid;gap:5px}nav button{border:0;background:transparent;color:#aeb3c0;text-align:left;padding:11px 12px;border-radius:11px;display:flex;align-items:center;gap:10px;font-size:13px}nav button:hover,nav button.active{background:#181b24;color:#fff}nav button.active{box-shadow:inset 3px 0 var(--accent)}nav .badge{margin-left:auto;background:#262a35;color:#cfd3dc;border-radius:999px;padding:2px 7px;font-size:10px}.side-bottom{margin-top:auto}.plan{border:1px solid var(--line);border-radius:14px;padding:12px;background:linear-gradient(145deg,#151720,#0e1015)}.plan span,.plan small{display:block;color:var(--muted);font-size:10px}.plan strong{display:block;font-size:12px;margin:3px 0 9px}.plan button{border:0;border-radius:9px;background:var(--accent);color:white;padding:7px 10px;font-size:11px}.version{color:#5f6472;font-size:10px;padding:12px 4px}.main{margin-left:255px;min-height:100vh}.header{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:15px;position:sticky;top:0;z-index:10;background:rgba(7,8,12,.82);backdrop-filter:blur(18px)}.header-title{display:none}.search{margin-left:auto;width:min(280px,30vw);background:#101219;border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:white;outline:none}.search:focus{border-color:#484c59}.header button{border:1px solid var(--line);background:#11131a;color:#dfe2e9;border-radius:10px;padding:9px 11px}.profile{display:flex;align-items:center;gap:8px}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#252834;color:white;font-size:12px}.content{padding:28px;max-width:1400px;margin:auto}.eyebrow{color:var(--accent2);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em}.title{font-size:28px;margin:5px 0 6px;letter-spacing:-.04em}.sub{color:var(--muted);font-size:13px}.hero{margin-top:24px;border:1px solid #302532;border-radius:20px;padding:24px;background:radial-gradient(circle at 85% 15%,rgba(255,61,145,.18),transparent 32%),linear-gradient(135deg,#14121a,#0d0f15);display:flex;justify-content:space-between;gap:20px;align-items:center}.hero h2{margin:5px 0;font-size:21px}.hero p{color:var(--muted);margin:7px 0 0;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary,.secondary{border-radius:10px;padding:10px 13px;border:1px solid var(--line);font-size:12px}.primary{background:var(--accent);color:white;border-color:var(--accent)}.secondary{background:#171922;color:#e7e9ee}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.card{border:1px solid var(--line);background:rgba(14,16,22,.86);border-radius:15px;padding:16px}.stat-label{color:var(--muted);font-size:11px}.stat{font-size:25px;font-weight:750;margin:8px 0}.delta{font-size:10px;color:var(--good)}.grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;margin-top:14px}.card h3{margin:0 0 13px;font-size:14px}.chart{height:190px;display:flex;align-items:end;gap:8px;padding:12px 2px 2px}.bar{flex:1;min-width:8px;background:linear-gradient(to top,var(--accent),#ff9ac5);border-radius:5px 5px 2px 2px;opacity:.85}.activity{display:grid;gap:10px}.activity-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #1d2029;font-size:11px}.activity-row:last-child{border:0}.muted{color:var(--muted)}.status{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:999px;font-size:10px;background:#171a22}.dot{width:6px;height:6px;border-radius:50%;background:var(--good)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:20px 0 12px;flex-wrap:wrap}.toolbar-left,.toolbar-right{display:flex;gap:8px;flex-wrap:wrap}.input,.select{background:#101219;color:white;border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:750px}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #1c1f28;font-size:11px}.table th{color:#7f8595;font-weight:600}.table td{color:#d9dce4}.table tr:last-child td{border:0}.pill{padding:4px 7px;border-radius:999px;background:#191c24;font-size:10px}.green{color:var(--good)}.pink{color:var(--accent2)}.empty{padding:45px;text-align:center;color:var(--muted)}.docs-tabs{display:flex;gap:5px;margin:20px 0}.docs-tabs button{border:1px solid var(--line);background:#101219;color:#aeb3c0;padding:9px 12px;border-radius:9px}.docs-tabs button.active{background:#25202a;color:#fff;border-color:#4a2a3d}.code{background:#090b10;border:1px solid var(--line);border-radius:12px;padding:15px;overflow:auto;font:11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:#dce0e8;white-space:pre}.price-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}.price strong{font-size:27px}.price ul{padding-left:18px;color:var(--muted);font-size:11px;line-height:2}.price.pop{border-color:#5b2c48;box-shadow:0 0 0 1px rgba(255,61,145,.12)}.tag{display:inline-block;background:rgba(255,61,145,.13);color:var(--accent2);padding:4px 7px;border-radius:999px;font-size:9px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.setting{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:13px 0;border-bottom:1px solid #1c1f28}.setting:last-child{border:0}.setting b{font-size:12px}.setting small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.switch{width:42px;height:23px;border-radius:999px;border:0;background:#292d38;padding:2px}.switch i{display:block;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s}.switch.on{background:var(--accent)}.switch.on i{transform:translateX(19px)}.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}.modal-bg.show{display:flex}.modal{width:min(520px,100%);background:#101219;border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:var(--shadow)}.modal h3{margin:0 0 15px}.form{display:grid;gap:10px}.form label{font-size:10px;color:var(--muted)}.form input,.form select,.form textarea{width:100%;background:#0a0c11;color:white;border:1px solid var(--line);border-radius:9px;padding:10px;outline:none}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;right:20px;bottom:20px;z-index:80;background:#171a22;border:1px solid #343845;padding:12px 14px;border-radius:11px;display:none;box-shadow:var(--shadow);font-size:12px}.toast.show{display:block}.mobile-menu{display:none}.light{--bg:#f5f6f8;--panel:#fff;--panel2:#f0f1f4;--line:#dedfe5;--text:#17181d;--muted:#737783}.light .sidebar,.light .header{background:rgba(250,250,252,.9)}.light .card,.light .search,.light .input,.light .select,.light .header button,.light .docs-tabs button{background:#fff;color:var(--text)}.light .hero{background:linear-gradient(135deg,#fff,#f7eaf1)}
@media(max-width:900px){.sidebar{transform:translateX(-100%);transition:.22s}.sidebar.open{transform:none}.main{margin-left:0}.mobile-menu{display:block}.header-title{display:block;font-size:13px;font-weight:700}.search{display:none}.content{padding:20px}.stats{grid-template-columns:repeat(2,1fr)}.grid2,.settings-grid{grid-template-columns:1fr}.price-grid{grid-template-columns:repeat(2,1fr)}.hero{align-items:flex-start;flex-direction:column}}
@media(max-width:520px){.content{padding:15px}.stats,.price-grid{grid-template-columns:1fr}.title{font-size:23px}.hero{padding:18px}.header{padding:0 15px}.profile .name{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><span class="logo">✦</span><span>Nguyễn Cường <b>iOS</b><small>ChatGPTDeveloper</small></span></div>
  <div class="workspace">🛡️ Production workspace</div>
  <nav id="nav"></nav>
  <div class="side-bottom"><div class="plan"><span>Pro Workspace</span><strong>Đang hoạt động</strong><button onclick="go('pricing')">Quản lý gói</button></div><div class="version">v2.0.0 • Local API</div></div>
</aside>
<section class="main">
<header class="header"><button class="mobile-menu" onclick="toggleSide()">☰</button><div class="header-title" id="mobileTitle">Tổng quan</div><input class="search" id="globalSearch" placeholder="Tìm nhanh..." oninput="renderCurrent()"><button onclick="toast('Không có thông báo mới')">🔔</button><button class="profile" onclick="go('settings')"><span class="avatar" id="avatar">N</span><span class="name" id="profileName">Developer</span>⌄</button><button onclick="toggleTheme()">☼</button></header>
<main class="content" id="content"></main>
</section></div>
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
const navItems=[['dashboard','Tổng quan','⌂'],['keys','API Keys','🔑'],['packages','Packages','▣'],['analytics','Analytics','▥'],['docs','Tài liệu','▤'],['pricing','Gói dịch vụ','◈'],['settings','Cài đặt','⚙']];
let db=JSON.parse(localStorage.getItem('nc-auth-db')||'null')||{keys:[{id:1,key:'NC-7K2A-9P4X',package:'ChatGPT iOS',status:'active',expires:'2026-12-31',devices:2,requests:12840,notes:'Production'}],packages:[{id:1,name:'ChatGPT iOS',version:'1.4.0',status:'active',devices:126,keys:1,token:'pk_live_nc_8f3d'}]};
let state={page:'dashboard',edit:null};
function save(){localStorage.setItem('nc-auth-db',JSON.stringify(db))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function toast(m){let e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),2500)}
function toggleSide(){document.getElementById('sidebar').classList.toggle('open')}
function go(p){state.page=p;document.getElementById('sidebar').classList.remove('open');renderNav();renderCurrent()}
function renderNav(){document.getElementById('nav').innerHTML=navItems.map(([id,l,i])=>`<button class="${state.page===id?'active':''}" onclick="go('${id}')">${i}<span>${l}</span>${id==='keys'?'<span class="badge">'+db.keys.length+'</span>':''}</button>`).join('')}
function toggleTheme(){document.body.classList.toggle('light');localStorage.setItem('nc-theme',document.body.classList.contains('light')?'light':'dark')}
function stat(label,val,delta){return `<div class="card"><div class="stat-label">${label}</div><div class="stat">${val}</div><div class="delta">${delta}</div></div>`}
function dashboard(){let req=db.keys.reduce((a,k)=>a+k.requests,0);return `<div class="eyebrow">Nguyễn Cường iOS</div><h1 class="title">Xin chào, Developer 👋</h1><div class="sub">Quản lý KeyAuth, package và hoạt động API trong một workspace.</div><div class="hero"><div><span class="tag">PRO WORKSPACE</span><h2>iOS KeyAuth Manager</h2><p>Không cần đăng nhập. Dữ liệu demo được lưu trực tiếp trên thiết bị bằng localStorage.</p></div><div class="actions"><button class="primary" onclick="openKey()">+ Tạo API Key</button><button class="secondary" onclick="go('docs')">Xem tài liệu</button></div></div><div class="stats">${stat('Packages',db.packages.length,'↑ Workspace')} ${stat('API Keys',db.keys.length,'↑ Quản lý')} ${stat('Requests',req.toLocaleString(),'↑ Tổng requests')} ${stat('Hoạt động','99.9%','● Hệ thống ổn định')}</div><div class="grid2"><div class="card"><h3>API usage • 7 ngày</h3><div class="chart">${[42,58,46,74,61,89,68,78,54,91,70,84,63,76].map(v=>`<div class="bar" style="height:${v}%"></div>`).join('')}</div></div><div class="card"><h3>Hoạt động gần đây</h3><div class="activity">${db.keys.slice(0,4).map(k=>`<div class="activity-row"><span>Key <b>${esc(k.key)}</b><br><span class="muted">${esc(k.package)}</span></span><span class="muted">vừa xong</span></div>`).join('')||'<div class="empty">Chưa có hoạt động</div>'}</div></div></div>`}
function keys(){let q=(document.getElementById('globalSearch').value||'').toLowerCase();let rows=db.keys.filter(k=>Object.values(k).join(' ').toLowerCase().includes(q));return `<div class="eyebrow">Management</div><h1 class="title">API Keys</h1><div class="sub">Tạo, chỉnh sửa, tạm dừng và xuất danh sách key.</div><div class="toolbar"><div class="toolbar-left"><input class="input" placeholder="Tìm key..." value="${esc(q)}" oninput="document.getElementById('globalSearch').value=this.value;renderCurrent()"></div><div class="toolbar-right"><button class="secondary" onclick="exportKeys()">Xuất CSV</button><button class="primary" onclick="openKey()">+ Tạo key</button></div></div><div class="table-wrap"><table class="table"><thead><tr><th>KEY</th><th>PACKAGE</th><th>STATUS</th><th>EXPIRES</th><th>DEVICES</th><th>REQUESTS</th><th></th></tr></thead><tbody>${rows.map(k=>`<tr><td><b>${esc(k.key)}</b><br><span class="muted">${esc(k.notes)}</span></td><td>${esc(k.package)}</td><td><span class="pill ${k.status==='active'?'green':''}">${k.status==='active'?'Active':'Paused'}</span></td><td>${esc(k.expires)}</td><td>${k.devices}</td><td>${k.requests.toLocaleString()}</td><td><button class="secondary" onclick="editKey(${k.id})">Sửa</button> <button class="secondary" onclick="toggleKey(${k.id})">${k.status==='active'?'Pause':'Resume'}</button> <button class="secondary" onclick="deleteKey(${k.id})">Xóa</button></td></tr>`).join('')||'<tr><td colspan="7"><div class="empty">Không tìm thấy key.</div></td></tr>'}</tbody></table></div>`}
function packages(){let q=(document.getElementById('globalSearch').value||'').toLowerCase();let rows=db.packages.filter(p=>Object.values(p).join(' ').toLowerCase().includes(q));return `<div class="eyebrow">Workspace</div><h1 class="title">Packages</h1><div class="sub">Quản lý các package iOS và token tích hợp.</div><div class="toolbar"><input class="input" placeholder="Tìm package..." value="${esc(q)}" oninput="document.getElementById('globalSearch').value=this.value;renderCurrent()"><button class="primary" onclick="openPackage()">+ Tạo package</button></div><div class="table-wrap"><table class="table"><thead><tr><th>PACKAGE</th><th>VERSION</th><th>STATUS</th><th>DEVICES</th><th>KEYS</th><th>TOKEN</th><th></th></tr></thead><tbody>${rows.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.version)}</td><td><span class="pill ${p.status==='active'?'green':''}">${p.status}</span></td><td>${p.devices}</td><td>${p.keys}</td><td><code>${esc(p.token)}</code></td><td><button class="secondary" onclick="editPackage(${p.id})">Sửa</button> <button class="secondary" onclick="togglePackage(${p.id})">${p.status==='active'?'Pause':'Resume'}</button> <button class="secondary" onclick="deletePackage(${p.id})">Xóa</button></td></tr>`).join('')||'<tr><td colspan="7"><div class="empty">Chưa có package.</div></td></tr>'}</tbody></table></div>`}
function analytics(){let total=db.keys.reduce((a,k)=>a+k.requests,0);return `<div class="eyebrow">Insights</div><h1 class="title">Analytics</h1><div class="sub">Theo dõi requests và trạng thái workspace.</div><div class="stats">${stat('Requests',total.toLocaleString(),'7 ngày')} ${stat('Errors','0.08%','↓ 12%')} ${stat('Latency','84 ms','↓ 9 ms')} ${stat('Uptime','99.9%','Ổn định')}</div><div class="grid2"><div class="card"><h3>Requests theo ngày</h3><div class="chart">${[35,44,57,51,68,73,62,79,84,71,88,91,76,86,94].map(v=>`<div class="bar" style="height:${v}%"></div>`).join('')}</div></div><div class="card"><h3>Top packages</h3><div class="activity">${db.packages.map((p,i)=>`<div class="activity-row"><b>${esc(p.name)}</b><span>${(p.devices*97).toLocaleString()} req</span></div>`).join('')||'<div class="empty">Chưa có dữ liệu</div>'}</div></div></div>`}
function docs(){let code=`// KeyAuth integration\nlet auth = Auth.shared\nauth.authenticate("YOUR_TOKEN") { result in\n    if result.isSuccess {\n        print("Authenticated")\n    }\n}`;return `<div class="eyebrow">Developer</div><h1 class="title">Tài liệu</h1><div class="sub">Tích hợp nhanh trong dự án iOS / Theos.</div><div class="docs-tabs"><button class="active">Overview</button><button>API Reference</button><button>SDK</button><button>Examples</button></div><div class="grid2"><div class="card"><h3>Quick start</h3><p class="muted">1. Tạo package → 2. Tạo API key → 3. Đưa token vào SDK → 4. Gọi authenticate.</p><button class="primary" onclick="copyCode()">Copy example</button></div><div class="card"><h3>Example</h3><pre class="code" id="code">${esc(code)}</pre></div></div><div class="card" style="margin-top:14px"><h3>SDK compatibility</h3><p class="muted">iOS 12+ • arm64 • arm64e • Keychain • expired-key handling • Local demo API.</p></div>`}
function pricing(){let plans=[['Free','0','Cho dự án cá nhân'],['Developer','9','Dành cho developer'],['Seller','29','Quản lý nhiều package'],['SupperSeller','79','Workspace nâng cao']];return `<div class="eyebrow">Plans</div><h1 class="title">Gói dịch vụ</h1><div class="sub">Chọn workspace phù hợp. Demo này xử lý nâng cấp bằng thông báo cục bộ.</div><div class="price-grid">${plans.map((p,i)=>`<div class="card price ${i===1?'pop':''}">${i===1?'<span class="tag">PHỔ BIẾN</span>':''}<h3>${p[0]}</h3><strong>$${p[1]}</strong><span class="muted"> / tháng</span><p class="muted">${p[2]}</p><ul><li>API key management</li><li>Package management</li><li>Analytics</li><li>Documentation</li></ul><button class="${i===1?'primary':'secondary'}" onclick="toast('${p[0]}: nâng cấp demo đã sẵn sàng')">${i===0?'Đang dùng':'Nâng cấp'}</button></div>`).join('')}</div>`}
function settings(){let light=document.body.classList.contains('light');return `<div class="eyebrow">Workspace</div><h1 class="title">Cài đặt</h1><div class="sub">Tuỳ chỉnh giao diện và dữ liệu local.</div><div class="settings-grid"><div class="card"><h3>Giao diện</h3><div class="setting"><div><b>Chế độ sáng</b><small>Đổi dark / light</small></div><button class="switch ${light?'on':''}" onclick="toggleTheme();renderCurrent()"><i></i></button></div><div class="setting"><div><b>Màu nhấn</b><small>Pink • #ff3d91</small></div><span class="pill pink">PINK</span></div></div><div class="card"><h3>Hồ sơ & dữ liệu</h3><div class="setting"><div><b>Tên hiển thị</b><small>Được lưu trên thiết bị</small></div><button class="secondary" onclick="editName()">Sửa</button></div><div class="setting"><div><b>Backup JSON</b><small>Xuất dữ liệu local</small></div><button class="secondary" onclick="backup()">Xuất</button></div><div class="setting"><div><b>Xoá dữ liệu demo</b><small>Không thể hoàn tác</small></div><button class="secondary" onclick="resetData()">Reset</button></div></div></div>`}
function renderCurrent(){let fn={dashboard,keys,packages,analytics,docs,pricing,settings}[state.page]||dashboard;document.getElementById('content').innerHTML=fn();document.getElementById('mobileTitle').textContent=navItems.find(x=>x[0]===state.page)?.[1]||'Tổng quan';document.getElementById('profileName').textContent=localStorage.getItem('display-name')||'Developer'}
function modal(title,body){document.getElementById('modal').innerHTML=`<h3>${title}</h3>${body}<div class="modal-actions"><button class="secondary" onclick="closeModal()">Hủy</button><button class="primary" id="modalSave">Lưu</button></div>`;document.getElementById('modalBg').classList.add('show')}
function closeModal(){document.getElementById('modalBg').classList.remove('show')}
function openKey(id){let k=id?db.keys.find(x=>x.id===id):null;modal(id?'Sửa API Key':'Tạo API Key',`<div class="form"><label>Key<input id="fKey" value="${esc(k?.key||'NC-'+Math.random().toString(36).slice(2,10).toUpperCase())}"></label><label>Package<input id="fPackage" value="${esc(k?.package||db.packages[0]?.name||'ChatGPT iOS')}"></label><label>Expires<input id="fExpires" type="date" value="${esc(k?.expires||'2026-12-31')}"></label><label>Devices<input id="fDevices" type="number" value="${k?.devices||1}"></label><label>Notes<textarea id="fNotes">${esc(k?.notes||'')}</textarea></label></div>`);document.getElementById('modalSave').onclick=()=>{let item={id:k?.id||Date.now(),key:fKey.value.trim(),package:fPackage.value.trim(),status:k?.status||'active',expires:fExpires.value,devices:+fDevices.value||1,requests:k?.requests||0,notes:fNotes.value.trim()};if(!item.key||!item.package){toast('Vui lòng nhập đủ thông tin');return}if(k)Object.assign(k,item);else db.keys.push(item);save();closeModal();renderNav();renderCurrent();toast('Đã lưu API Key')}
function editKey(id){openKey(id)}function toggleKey(id){let k=db.keys.find(x=>x.id===id);if(k){k.status=k.status==='active'?'paused':'active';save();renderCurrent();toast(k.status==='active'?'Đã resume key':'Đã pause key')}}function deleteKey(id){if(confirm('Xóa API key này?')){db.keys=db.keys.filter(k=>k.id!==id);save();renderNav();renderCurrent();toast('Đã xóa key')}}
function openPackage(id){let p=id?db.packages.find(x=>x.id===id):null;modal(id?'Sửa Package':'Tạo Package',`<div class="form"><label>Name<input id="pName" value="${esc(p?.name||'New iOS Package')}"></label><label>Version<input id="pVersion" value="${esc(p?.version||'1.0.0')}"></label><label>Token<input id="pToken" value="${esc(p?.token||'pk_live_'+Math.random().toString(36).slice(2,9))}"></label></div>`);document.getElementById('modalSave').onclick=()=>{let item={id:p?.id||Date.now(),name:pName.value.trim(),version:pVersion.value.trim(),status:p?.status||'active',devices:p?.devices||0,keys:p?.keys||0,token:pToken.value.trim()};if(!item.name||!item.version){toast('Vui lòng nhập đủ thông tin');return}if(p)Object.assign(p,item);else db.packages.push(item);save();closeModal();renderCurrent();toast('Đã lưu package')};}
function editPackage(id){openPackage(id)}function togglePackage(id){let p=db.packages.find(x=>x.id===id);if(p){p.status=p.status==='active'?'paused':'active';save();renderCurrent();toast('Đã cập nhật trạng thái')}}function deletePackage(id){if(confirm('Xóa package này?')){db.packages=db.packages.filter(p=>p.id!==id);save();renderCurrent();toast('Đã xóa package')}}
function exportKeys(){let csv='key,package,status,expires,devices,requests\n'+db.keys.map(k=>[k.key,k.package,k.status,k.expires,k.devices,k.requests].map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='api-keys.csv';a.click();toast('Đã xuất CSV')}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='nc-auth-backup.json';a.click();toast('Đã xuất backup')}
function resetData(){if(confirm('Reset toàn bộ dữ liệu demo?')){localStorage.removeItem('nc-auth-db');location.reload()}}
function editName(){modal('Tên hiển thị',`<div class="form"><label>Display name<input id="newName" value="${esc(localStorage.getItem('display-name')||'Developer')}"></label></div>`);document.getElementById('modalSave').onclick=()=>{localStorage.setItem('display-name',newName.value.trim()||'Developer');closeModal();renderCurrent();toast('Đã lưu tên hiển thị')}}
async function copyCode(){let code=document.getElementById('code').textContent;try{await navigator.clipboard.writeText(code);toast('Đã copy code')}catch(e){toast('Hãy copy thủ công')}}
if(localStorage.getItem('nc-theme')==='light')document.body.classList.add('light');renderNav();renderCurrent();
</script>
</body></html>
